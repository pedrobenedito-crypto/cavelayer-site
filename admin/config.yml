# Painel de edição da Cave Layer (Sveltia CMS)
# Repositório: pedrobenedito-crypto/cavelayer-site · Site: https://cavelayer-site.netlify.app (troque site_url/display_url se mudar de domínio)
backend:
  name: github
  repo: pedrobenedito-crypto/cavelayer-site
  branch: main

site_url: https://cavelayer-site.netlify.app
